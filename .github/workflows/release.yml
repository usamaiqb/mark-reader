name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-24.04

    steps:
      # fetch-depth: 0 so auto-generated release notes can find the previous tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Guard: the exact tagged commit is re-tested before we ship a signed APK.
      # Lint is skipped here — it's static and already covered on the PR.
      - name: Run unit tests
        run: ./gradlew test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      # One Gradle run, one R8 pass: the APK (GitHub, F-Droid's comparison) and the bundle
      # (Google Play) come from the same minified code, so they share a mapping file.
      - name: Build signed release APK and bundle
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/mark-reader-${{ github.ref_name }}.apk

      # Auto-generated notes: categorized PR list + "New Contributors" + compare
      # link. CHANGELOG.md is intentionally NOT used here (kept in-repo for
      # convention; the Release page is the auto-generated view).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/mark-reader-${{ github.ref_name }}.apk

      - name: Keep the bundle for the Play upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

  # A separate job so a Play failure never holds back the GitHub Release, and so the service
  # account key is only exposed here. The `play` environment can require an approval first.
  play:
    name: Upload to Google Play
    needs: release
    runs-on: ubuntu-24.04
    environment: play
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-bundle
          path: play-bundle

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      # Uploads the bundle to the testing track along with everything under
      # fastlane/metadata/android: the listing text, the graphics, the screenshots and
      # changelogs/<versionCode>.txt as the release notes. The same files F-Droid reads at
      # this tag, so both stores describe the same build.
      #
      # PLAY_TRACK is a repository variable; `alpha` is Play's default closed testing track.
      # A custom closed track is addressed by its name.
      - name: Upload bundle and store listing
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: |
          AAB=$(find play-bundle -name '*.aab' | head -n 1)
          MAPPING=$(find play-bundle -name 'mapping.txt' | head -n 1)
          bundle exec fastlane supply \
            --package_name com.markreader \
            --track "$TRACK" \
            --release_status completed \
            --aab "$AAB" \
            --mapping "$MAPPING" \
            --metadata_path fastlane/metadata/android \
            --sync_image_upload true \
            --skip_upload_apk true
