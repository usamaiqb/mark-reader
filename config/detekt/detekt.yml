# detekt configuration.
#
# Adapted from Fossify Documents' detekt.yml (GPL-3.0, the same licence as this project),
# which is a close analogue: Compose, a document reader, the same rule set.
#
# `buildUponDefaultConfig = true` in app/build.gradle.kts means this file only states where
# we differ from detekt's defaults. Compose-specific rules come from io.nlopez.compose.rules
# and are listed under `Compose:` at the bottom.

build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 2
    style: 1

processors:
  active: true
  exclude:
    - "FunctionCountProcessor"
    - "PropertyCountProcessor"

config:
  validation: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 8
    ignoreDefaultParameters: true
    # A composable's parameter list is its API, and hoisted state makes it long by design.
    ignoreAnnotated:
      - "Composable"
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated:
      - "Composable"
      - "Preview"

style:
  MagicNumber:
    active: true
    ignoreAnnotated: ["Composable"]
    ignoreEnums: true
    ignoreNumbers: ["-1", "0", "1", "2"]
    # A colour literal is already its own definition; naming `0xFF1E1E1E` adds nothing.
    # Nor do fixture values in tests, where the number *is* the case being tested.
    excludes: ["**/ui/theme/**", "**/test/**", "**/androidTest/**"]
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludes: ["**/test/**", "**/androidTest/**"]

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase, which the default pattern rejects.
    ignoreAnnotated: ["Composable", "Preview"]
    functionPattern: "[a-z][A-Za-z0-9]*"

Compose: # io.nlopez.compose.rules
  ComposableParametersOrdering:
    active: true
  ModifierDefaultValue:
    active: true
  MissingModifierDefaultValue:
    active: true
  PublicComposablePreview:
    active: true
